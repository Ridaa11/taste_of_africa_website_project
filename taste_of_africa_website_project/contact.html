<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Tastes of Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="logo" href="index.html">Tastes of Africa</a>
  <nav aria-label="Main"><ul><li><a href="index.html">Home</a></li><li><a href="recipes.html">Recipes</a></li><li><a href="west-africa.html">Regions</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
  <button id="theme-toggle" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
</header>
<main id="main" class="">
<section class="wrap narrow"><h1>Contact us</h1>
<form id="contact-form" novalidate>
<label for="name">Name</label><input type="text" id="name" name="name" required>
<label for="email">Email</label><input type="email" id="email" name="email" required>
<label for="country">Country</label><input list="countries" id="country" name="country" placeholder="Start typing"><datalist id="countries"><option value="Nigeria"><option value="Ghana"><option value="Kenya"><option value="Ethiopia"><option value="Morocco"><option value="South Africa"><option value="Rwanda"><option value="Egypt"><option value="United States"><option value="United Kingdom"></datalist>
<label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
<p id="form-error" class="error" role="alert"></p>
<button type="submit" class="btn">Send message</button></form>
<p id="thanks" class="thanks" role="status" hidden></p></section>
</main>
<footer class="site-footer">
  <p>Tastes of Africa. Celebrating the continent's food heritage.</p>
  <form id="newsletter" novalidate>
    <label for="nl-email">Get new recipes by email</label>
    <input type="email" id="nl-email" placeholder="you@example.com" required>
    <button type="submit">Sign up</button>
    <p id="nl-msg" role="status"></p>
  </form>
</footer>
<script src="script.js"></script>
</body>
</html>
